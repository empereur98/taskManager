name: CD - Frontend

on:
  workflow_run:
    workflows: ["CI - Frontend"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: taskManager-frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || vars.VITE_API_URL_TEST }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-vercel:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.FRONTEND_PROD_URL }}

    steps:
      - name: Déclencher le redéploiement sur Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "Déclenchement du redéploiement Vercel via Deploy Hook..."
            curl -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          else
            echo "VERCEL_DEPLOY_HOOK non défini : déploiement pris en charge nativement par l'intégration Git de Vercel."
          fi

      - name: Smoke test (vérification de disponibilité)
        run: |
          FRONTEND_URL="${{ vars.FRONTEND_PROD_URL || secrets.FRONTEND_PROD_URL }}"
          if [ -n "$FRONTEND_URL" ]; then
            echo "Attente de propagation et test de $FRONTEND_URL..."
            sleep 15
            curl --fail --retry 10 --retry-delay 10 "$FRONTEND_URL"
          else
            echo "FRONTEND_PROD_URL non renseigné, smoke test ignoré."
          fi

  notify-failure:
    needs: [publish, deploy-vercel]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notifier l'échec du déploiement
        run: echo "Le déploiement frontend a échoué sur le commit ${{ github.sha }} - à brancher sur un webhook Slack/Discord via secrets.WEBHOOK_URL."

