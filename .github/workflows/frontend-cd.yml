name: CD - Frontend

on:
  workflow_run:
    workflows: ["CI - Frontend"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-frontend

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: taskManager-frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL_TEST }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-test:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: taskmanager-frontend-test
          region: ${{ secrets.GCP_REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}

      - name: Smoke test
        run: |
          curl --fail --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/health"

  notify-failure:
    needs: [publish, deploy-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notifier l'echec du deploiement
        run: echo "Le deploiement frontend a echoue sur le commit ${{ github.sha }} - a brancher sur un webhook Slack/Discord via secrets.WEBHOOK_URL."
