name: CD - Backend

# Le declenchement depend du succes complet de la CI backend (build, tests,
# JaCoCo, secret scan, SAST, scan de conteneur) : cf. remarque pedagogique
# du Module 4. Le filtre "paths" de la CI garantit qu'elle ne s'execute que
# lorsque backend/** change ; ce workflow ne se declenche donc lui aussi
# que dans ce cas.
on:
  workflow_run:
    workflows: ["CI - Backend"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name for Docker
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> $GITHUB_ENV

      - name: Log in to GHCR

        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: taskManager-backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
  deploy-render:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.BACKEND_PROD_URL }}
    steps:
      - name: Déclencher le redéploiement sur Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Déclenchement du redéploiement Render..."
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          else
            echo "RENDER_DEPLOY_HOOK non défini : déploiement pris en charge nativement par Render sur push Git."
          fi

      - name: Smoke test (vérification de santé)
        run: |
          BACKEND_URL="${{ vars.BACKEND_PROD_URL }}"
          if [ -n "$BACKEND_URL" ]; then
            echo "Attente du démarrage du service sur Render ($BACKEND_URL)..."
            sleep 30
            curl --fail --retry 15 --retry-delay 10 "$BACKEND_URL/actuator/health"
          else
            echo "BACKEND_PROD_URL non renseigné, smoke test ignoré."
          fi

  notify-failure:
    needs: [publish, deploy-render]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notifier l'échec du déploiement
        run: echo "Le déploiement backend a échoué sur le commit ${{ github.sha }} - à brancher sur un webhook Slack/Discord via secrets.WEBHOOK_URL."

