name: CodeQL - Scan complet planifie

on:
  schedule:
    - cron: "0 3 * * 1" # tous les lundis a 03h00, hors chemin critique des PR
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskManager-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: taskManager-backend/pom.xml

      - uses: github/codeql-action/init@v3
        with:
          languages: java
          source-root: taskManager-backend
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build
        run: ./mvnw -B -DskipTests package

      - uses: github/codeql-action/analyze@v3

  analyze-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: taskManager-frontend

      - uses: github/codeql-action/analyze@v3
