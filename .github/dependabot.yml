version: 2
updates:
  # --- Backend (Java / Maven) ---
  - package-ecosystem: "maven"
    directory: "/taskManager-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      jjwt:
        patterns:
          - "io.jsonwebtoken:*"


  - package-ecosystem: "docker"
    directory: "/taskManager-backend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "backend", "docker"]

  # --- Frontend (npm) ---
  - package-ecosystem: "npm"
    directory: "/taskManager-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    ignore:
      - dependency-name: "@types/react-dom"
        versions: [">= 19.a"]
      - dependency-name: "@types/react"
        versions: [">= 19.a"]
      - dependency-name: "react"
        versions: [">= 19.a"]
      - dependency-name: "react-dom"
        versions: [">= 19.a"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">= 4.4.a"]


  - package-ecosystem: "docker"
    directory: "/taskManager-frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend", "docker"]

  # --- Mobile (Dart / pub) ---
  - package-ecosystem: "pub"
    directory: "/taskManager-mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "mobile"]

  # --- Pipeline elle-meme ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
